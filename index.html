  <!-- Theme Detector - Load early to update icons before page render -->
  <script>
    // Immediate theme detection to avoid flash of wrong icon
    (function () {
      function updateIconsImmediate() {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          const themePath = '/icons/dark';
          // Update favicons
          const favicon16 = document.querySelector('link[rel="icon"][sizes="16x16"]');
          const favicon32 = document.querySelector('link[rel="icon"][sizes="32x32"]');
          if (favicon16) favicon16.href = themePath + '/favicon-16x16.png';
          if (favicon32) favicon32.href = themePath + '/favicon-32x32.png';
          // Update Apple touch icons
          const apple152 = document.querySelector('link[rel="apple-touch-icon"][sizes="152x152"]');
          const apple167 = document.querySelector('link[rel="apple-touch-icon"][sizes="167x167"]');
          const apple180 = document.querySelector('link[rel="apple-touch-icon"][sizes="180x180"]');
          if (apple152) apple152.href = themePath + '/apple-touch-icon-152x152.png';
          if (apple167) apple167.href = themePath + '/apple-touch-icon-167x167.png';
          if (apple180) apple180.href = themePath + '/apple-touch-icon-180x180.png';
        }
      }
      // Try immediately
      updateIconsImmediate();
      // Also try after a tiny delay to ensure DOM is ready
      setTimeout(updateIconsImmediate, 0);
    })();
  </script>
